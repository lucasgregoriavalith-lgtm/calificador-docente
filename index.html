<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Calificador Docente</title>
<meta name="description" content="Calificador docente: cursos, materias, estudiantes y notas, todo guardado en el celular.">
<meta name="theme-color" content="#2563eb">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Calificador">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="app">
  <header id="app-header">
    <button id="btn-back" class="icon-btn" hidden aria-label="Volver">&larr;</button>
    <h1 id="header-title">Calificador Docente</h1>
    <button id="btn-add" class="icon-btn" aria-label="Agregar">+</button>
  </header>
  <nav id="breadcrumb" hidden></nav>
  <main id="app-main"></main>
</div>

<div id="modal-overlay" class="modal-overlay" hidden>
  <div id="modal-box" class="modal-box"></div>
</div>

<div id="toast" class="toast" hidden></div>

<input type="file" id="import-file-input" accept="application/json,.json" hidden>

<script src="js/app.js"></script>
</body>
</html>
